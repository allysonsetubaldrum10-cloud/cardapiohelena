<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171415"><title>Helena | Salgados</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#141214}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 4%,#6d3d25 0,transparent 35%),#141214;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1100px;margin:auto;padding:22px 20px 110px}.top,.between,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:900;letter-spacing:-.8px}.brand span,.accent{color:#ff9a2e}.muted{color:#b8ada7}.glass{background:linear-gradient(140deg,#ffffff1c,#ffffff08);border:1px solid #ffffff25;box-shadow:0 16px 42px #0005;backdrop-filter:blur(18px);border-radius:23px}.pill{border-radius:100px;padding:10px 14px;background:#ffffff15;color:#fff}.orange{background:linear-gradient(110deg,#ffad37,#f47709);color:#20120a;font-weight:800;border-radius:14px;padding:13px 18px}.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:310px;margin:28px 0 26px;padding:32px;overflow:hidden;position:relative;background:radial-gradient(circle at 80% 50%,#ac5d2d66,transparent 50%),linear-gradient(120deg,#292023,#171416)}.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.02;letter-spacing:-2px;margin:14px 0}.hero p{max-width:340px;line-height:1.5}.hero img{width:100%;height:260px;object-fit:cover;border-radius:20px;mask-image:linear-gradient(to right,transparent,#000 25%)}.tag{font-size:12px;color:#ffb66d;text-transform:uppercase;letter-spacing:2px;font-weight:800}.search{width:100%;background:#ffffff12;color:#fff;border:1px solid #ffffff29;padding:15px 18px;border-radius:15px;outline:0;margin:8px 0 18px}.cats{display:flex;gap:10px;overflow:auto;padding:4px 0 20px}.cats button{flex-shrink:0}.cats .active{background:#ff9a2e;color:#1c120b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.item{overflow:hidden}.photo{width:100%;height:190px;object-fit:cover;background:#3b2a20}.info{padding:16px}.info h3{font-size:17px;margin:5px 0}.price{font-weight:800;color:#ffab45}.small{font-size:13px}.add{width:37px;height:37px;border-radius:12px;background:#f9931f;color:#231308;font-size:24px;font-weight:800}.nav{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:10px;display:flex;justify-content:space-around;z-index:5;background:#252023ed}.nav button{background:none;color:#d6c6ba;padding:10px 14px}.nav button.active{color:#ff9a2e}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{width:min(510px,100%);max-height:90vh;overflow:auto;padding:22px;background:#282224}.dialog img{width:100%;height:230px;object-fit:cover;border-radius:17px}.dialog input,.dialog textarea{display:block;width:100%;background:#ffffff12;border:1px solid #ffffff25;color:white;padding:12px;border-radius:12px;margin:9px 0}.dialog label{display:block;margin-top:12px;color:#d5c8c0;font-size:13px}.close{background:#ffffff20;color:#fff;border-radius:50%;width:36px;height:36px}.cartline{padding:12px 0;border-bottom:1px solid #ffffff20}.empty{text-align:center;padding:50px 15px;color:#b7aaa2}.footer{margin:40px 0;color:#8f817b;text-align:center;font-size:12px}@media(max-width:700px){.shell{padding:17px 15px 110px}.hero{grid-template-columns:1fr 42%;min-height:240px;padding:20px}.hero h1{font-size:35px}.hero img{height:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo{height:145px}.info{padding:12px}.info h3{font-size:15px}}@media(max-width:380px){.hero{grid-template-columns:1fr}.hero img{display:none}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header class="top"><div class="brand">Helena<span>.</span></div><div class="row"><span class="muted small">Feito com carinho 🧡</span><button class="pill" id="adminBtn" aria-label="Configurações">⚙</button></div></header>
<section class="hero glass"><div><div class="tag">Sabor que surpreende</div><h1>Bom salgado.<br><span class="accent">Bom momento!</span></h1><p class="muted">Escolha seus favoritos e peça com facilidade.</p><button class="orange" onclick="document.getElementById('produtos').scrollIntoView({behavior:'smooth'})">Ver cardápio →</button></div><img alt="Salgados fresquinhos" src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=900&q=85" onerror="this.style.display='none'"></section>
<section id="produtos"><div class="between"><h2>Nosso cardápio</h2><span class="muted small" id="count"></span></div><input id="search" class="search" placeholder="⌕  Buscar seu salgado favorito..." aria-label="Buscar produtos"><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section>
<div class="footer">Helena • Sabor que faz qualquer momento melhor</div></main>
<nav class="nav glass"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ Início</button><button onclick="document.getElementById('produtos').scrollIntoView({behavior:'smooth'})">▦ Cardápio</button><button onclick="showCart()">🛒 Carrinho <span id="cartCount">0</span></button></nav><div id="overlay"></div>
<script>
const defaults=[{id:1,name:'Coxinha cremosa',category:'Salgados',price:7.5,img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=700&q=85',description:'Crocante por fora, cremosa por dentro.'},{id:2,name:'Risoles especial',category:'Salgados',price:7,img:'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=700&q=85',description:'Massa delicada e recheio saboroso.'},{id:3,name:'Bolinha de queijo',category:'Salgados',price:6.5,img:'https://images.unsplash.com/photo-1547592180-85f173990554?w=700&q=85',description:'Queijo derretendo a cada mordida.'},{id:4,name:'Combo da Helena',category:'Combos',price:25,img:'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=700&q=85',description:'Uma seleção especial para compartilhar.'}];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let products=load('helena_products',defaults),config=load('helena_config',{whatsapp:'',pix:'',delivery:'A combinar'}),cart=load('helena_cart',{}),category='Todos';
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem('helena_cart',JSON.stringify(cart));document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
function render(){const cats=['Todos',...new Set(products.map(p=>p.category))];document.getElementById('cats').innerHTML=cats.map(c=>'<button class="pill '+(category===c?'active':'')+'" data-cat="'+safe(c)+'">'+safe(c)+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});const q=document.getElementById('search').value.toLowerCase();const found=products.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLowerCase().includes(q));document.getElementById('count').textContent=found.length+' opções';document.getElementById('grid').innerHTML=found.map(p=>'<article class="glass item"><img class="photo" src="'+safe(p.img)+'" alt="'+safe(p.name)+'" onerror="this.style.opacity=.2"><div class="info"><span class="tag">'+safe(p.category)+'</span><h3>'+safe(p.name)+'</h3><p class="muted small">'+safe(p.description||'')+'</p><div class="between"><span class="price">'+money(p.price)+'</span><button class="add" data-id="'+p.id+'" aria-label="Adicionar '+safe(p.name)+'">+</button></div></div></article>').join('')||'<p class="muted">Nenhum produto encontrado.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;save();b.textContent='✓';setTimeout(()=>b.textContent='+',700)})}
document.getElementById('search').oninput=render;function closeModal(){document.getElementById('overlay').innerHTML=''}function modal(html){document.getElementById('overlay').innerHTML='<div class="modal" id="backdrop"><div class="dialog glass"><div class="between"><strong class="brand">Helena<span>.</span></strong><button class="close" onclick="closeModal()">×</button></div>'+html+'</div></div>';document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function qty(id,delta){cart[id]=Math.max(0,(cart[id]||0)+delta);if(!cart[id])delete cart[id];save();showCart()}
function showCart(){const entries=products.filter(p=>cart[p.id]>0),total=entries.reduce((s,p)=>s+p.price*cart[p.id],0);modal('<h2>Seu carrinho 🛒</h2>'+(entries.length?entries.map(p=>'<div class="between cartline"><div><b>'+safe(p.name)+'</b><div class="muted small">'+money(p.price)+'</div></div><div class="row"><button class="pill" onclick="qty('+p.id+',-1)">−</button>'+cart[p.id]+'<button class="pill" onclick="qty('+p.id+',1)">+</button></div></div>').join('')+'<h3>Total: '+money(total)+'</h3><p class="muted small">Entrega: '+safe(config.delivery)+'</p><label>Seu nome</label><input id="clientName" placeholder="Nome completo"><label>WhatsApp</label><input id="clientPhone" placeholder="Seu telefone"><label>Endereço para entrega ou retirada</label><input id="clientAddress" placeholder="Rua, número e bairro"><label>Observações</label><textarea id="clientNotes" placeholder="Alguma preferência?"></textarea><p class="muted small">Pagamento por Pix: '+safe(config.pix||'Consulte a loja')+'. Envie o comprovante pelo WhatsApp.</p><button class="orange" style="width:100%" onclick="checkout()">Finalizar pelo WhatsApp</button>':'<div class="empty">Seu carrinho está vazio. Escolha algo gostoso!</div>'))}
function checkout(){if(!config.whatsapp){alert('WhatsApp da loja ainda não configurado.');return}const name=document.getElementById('clientName').value.trim(),phone=document.getElementById('clientPhone').value.trim(),address=document.getElementById('clientAddress').value.trim();if(!name||!phone||!address){alert('Preencha nome, WhatsApp e endereço.');return}const lines=products.filter(p=>cart[p.id]).map(p=>cart[p.id]+'x '+p.name+' — '+money(p.price*cart[p.id]));const total=products.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);const msg=['Olá, Helena! Quero fazer um pedido:',...lines,'Total: '+money(total),'Entrega: '+config.delivery,'Nome: '+name,'Telefone: '+phone,'Endereço: '+address,'Observações: '+document.getElementById('clientNotes').value,'Pix: enviar comprovante após pagamento'].join('\n');window.open('https://wa.me/'+config.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank','noopener')}
document.getElementById('adminBtn').onclick=()=>{modal('<h2>Configurações da loja</h2><p class="muted small">Atenção: alterações aqui ficam apenas neste navegador. Este painel não tem autenticação; não use para dados sensíveis.</p><label>WhatsApp da loja (com DDI 55)</label><input id="admWa" value="'+safe(config.whatsapp)+'"><label>Chave Pix</label><input id="admPix" value="'+safe(config.pix)+'"><label>Informação de entrega</label><input id="admDelivery" value="'+safe(config.delivery)+'"><label>Produtos (JSON)</label><textarea id="admProducts" style="min-height:190px">'+safe(JSON.stringify(products,null,2))+'</textarea><button class="orange" onclick="saveAdmin()">Salvar neste navegador</button>')};
function saveAdmin(){let parsed;try{parsed=JSON.parse(document.getElementById('admProducts').value);if(!Array.isArray(parsed)||!parsed.every(p=>p.id!=null&&p.name&&Number.isFinite(Number(p.price))))throw Error('Formato inválido')}catch{alert('Revise o JSON dos produtos.');return}products=parsed;config={whatsapp:document.getElementById('admWa').value,pix:document.getElementById('admPix').value,delivery:document.getElementById('admDelivery').value};localStorage.setItem('helena_products',JSON.stringify(products));localStorage.setItem('helena_config',JSON.stringify(config));closeModal();render()}
save();render();
</script></body></html>
